name: Kanban Automation

on:
  pull_request:
    types: [opened, reopened]
  pull_request_target:
    types: [closed]

jobs:
  move-to-review:
    name: PR 오픈 시 → Review 이동
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues to Review
        uses: actions/github-script@v7
        env:
          KANBAN_TOKEN: ${{ secrets.KANBAN_TOKEN }}
        with:
          github-token: ${{ secrets.KANBAN_TOKEN }}
          script: |
            const PROJECT_NUMBER = 9;
            const OWNER = 'ischung';
            const STATUS_FIELD_ID = 'PVTSSF_lAHOAQcRR84BRskhzg_cvmM';
            const REVIEW_OPTION_ID = 'cbd8ae18';

            const body = context.payload.pull_request.body || '';
            const matches = [...body.matchAll(/(?:Closes|Fixes|Resolves)\s+#(\d+)/gi)];
            const issueNumbers = matches.map(m => parseInt(m[1]));

            if (issueNumbers.length === 0) {
              console.log('연결된 이슈 없음. 종료.');
              return;
            }

            // 프로젝트 ID 조회
            const projectRes = await github.graphql(`
              query {
                user(login: "${OWNER}") {
                  projectV2(number: ${PROJECT_NUMBER}) { id }
                }
              }
            `);
            const projectId = projectRes.user.projectV2.id;

            // 프로젝트 아이템 목록 조회
            const itemsRes = await github.graphql(`
              query {
                user(login: "${OWNER}") {
                  projectV2(number: ${PROJECT_NUMBER}) {
                    items(first: 100) {
                      nodes {
                        id
                        content { ... on Issue { number } }
                      }
                    }
                  }
                }
              }
            `);
            const items = itemsRes.user.projectV2.items.nodes;

            for (const issueNumber of issueNumbers) {
              const item = items.find(i => i.content?.number === issueNumber);
              if (!item) {
                console.log(`이슈 #${issueNumber} 프로젝트에 없음. 건너뜀.`);
                continue;
              }

              await github.graphql(`
                mutation {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: "${projectId}"
                    itemId: "${item.id}"
                    fieldId: "${STATUS_FIELD_ID}"
                    value: { singleSelectOptionId: "${REVIEW_OPTION_ID}" }
                  }) { projectV2Item { id } }
                }
              `);
              console.log(`✅ 이슈 #${issueNumber} → Review 완료`);
            }

  move-to-done:
    name: PR 머지 시 → Done 이동
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues to Done
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.KANBAN_TOKEN }}
          script: |
            const PROJECT_NUMBER = 9;
            const OWNER = 'ischung';
            const STATUS_FIELD_ID = 'PVTSSF_lAHOAQcRR84BRskhzg_cvmM';
            const DONE_OPTION_ID = '6560edd2';

            const body = context.payload.pull_request.body || '';
            const matches = [...body.matchAll(/(?:Closes|Fixes|Resolves)\s+#(\d+)/gi)];
            const issueNumbers = matches.map(m => parseInt(m[1]));

            if (issueNumbers.length === 0) {
              console.log('연결된 이슈 없음. 종료.');
              return;
            }

            const projectRes = await github.graphql(`
              query {
                user(login: "${OWNER}") {
                  projectV2(number: ${PROJECT_NUMBER}) { id }
                }
              }
            `);
            const projectId = projectRes.user.projectV2.id;

            const itemsRes = await github.graphql(`
              query {
                user(login: "${OWNER}") {
                  projectV2(number: ${PROJECT_NUMBER}) {
                    items(first: 100) {
                      nodes {
                        id
                        content { ... on Issue { number } }
                      }
                    }
                  }
                }
              }
            `);
            const items = itemsRes.user.projectV2.items.nodes;

            for (const issueNumber of issueNumbers) {
              const item = items.find(i => i.content?.number === issueNumber);
              if (!item) {
                console.log(`이슈 #${issueNumber} 프로젝트에 없음. 건너뜀.`);
                continue;
              }

              await github.graphql(`
                mutation {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: "${projectId}"
                    itemId: "${item.id}"
                    fieldId: "${STATUS_FIELD_ID}"
                    value: { singleSelectOptionId: "${DONE_OPTION_ID}" }
                  }) { projectV2Item { id } }
                }
              `);
              console.log(`✅ 이슈 #${issueNumber} → Done 완료`);
            }
